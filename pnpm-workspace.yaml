packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  rclone.js: true
  sharp: true
  unrs-resolver: false
  workerd: true

auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

autoInstallPeers: false
engineStrict: true
minimumReleaseAgeExclude:
  - jose@6.2.7
overrides:
  adm-zip@<0.6.0: 0.6.0
  js-yaml@>=3.0.0 <4.0.0: 3.15.1
  js-yaml@>=4.0.0 <5.0.0: 4.3.1
  js-yaml@>=5.0.0 <6.0.0: 5.2.3
  nanoid@<3.3.17: 3.3.18
  uuid@<11.1.1: 11.1.1
packageImportMethod: copy
preferWorkspacePackages: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
verifyDepsBeforeRun: false
